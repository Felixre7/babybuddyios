name: PR

on:
  pull_request:

# A new push cancels the in-flight run for the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # the attribution job reads the PR body

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this PR touch anything the app build depends on?
        id: filter
        # Anything not recognised as docs counts as code, so an unfamiliar path
        # builds rather than slips through. `grep -v` without `-q`: ugrep (the
        # Mac's grep) inverts `-vq` as a whole-input test, not per line.
        run: |
          CODE=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                 | grep -vE '\.md$|^Docs/|^\.github/(ISSUE_TEMPLATE/|pull_request_template)' | head -1)
          if [ -n "$CODE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "touches $CODE (and maybe more): building"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "docs-only PR: skipping the macOS build"
          fi

  build-and-test:
    name: build-and-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # GitHub's macOS runners, which are free for a public repository. Pinned to
    # macos-26 rather than macos-latest: the suite needs iOS 26+, and -latest moves
    # to the next major on GitHub's schedule, not ours. That image is Apple Silicon
    # with Xcode 26.6 as default and iOS 26.2/26.4/26.5 simulator runtimes.
    #
    # This used to run on the development Mac via scripts/runner.sh. That was free
    # too, but the job only ran when the Mac was awake, reachable and not already
    # busy — a queued job, a wedged runner connection and a simulator another
    # process had upset all read as CI failures. The timeout stops a forgotten run
    # from hanging forever.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # A fork's PR gets no secrets, and `secrets` can't be read from a step's `if` — so the server
      # lane's condition rides on this instead, and skips there rather than failing the job.
      HAS_DEMO_SERVER: ${{ secrets.BB_E2E_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # On iOS 26 SwiftUI shows a confirmationDialog as a popover and UIKit drops its
      # cancel action — a destructive prompt with no way back shipped three times
      # (#89, #90, #119). `git grep`, not grep: it behaves the same here and on a
      # dev Mac, where plain grep may be ugrep.
      - name: No confirmationDialog
        run: |
          if git grep -n '\.confirmationDialog(' -- Sources Widgets; then
            echo "::error::confirmationDialog loses its Cancel on iOS 26 — use .alert or a design-system dialog (CLAUDE.md ▸ UI)"
            exit 1
          fi
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      # BabyBuddy.xcodeproj is gitignored — the project is generated from project.yml.
      - name: Generate project
        run: xcodegen generate
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      # A named device of CI's own, on the newest iOS runtime the image ships.
      # The runner is a fresh VM, so this creates it every run rather than reusing
      # one; the name is what scripts/ui-test.sh takes as UI_TEST_DEVICE, and it
      # keeps the local and CI lanes on the same device either way.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(python3 -c '
          import json, subprocess, sys
          NAME = "CI-BabyBuddy"
          devs = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS" not in rt: continue
              for d in ds:
                  if d["name"] == NAME:
                      print(d["udid"]); sys.exit()
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS" not in rt: continue
              for d in ds:
                  if d["name"].startswith("iPhone"):
                      print(subprocess.check_output(
                          ["xcrun", "simctl", "create", NAME, d["deviceTypeIdentifier"], rt],
                          text=True).strip())
                      sys.exit()
          sys.exit("no iPhone simulator available")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      # The scheme builds BabyBuddyWidgets as a dependency, so this also catches an
      # app-only import sneaking into Sources/Shared or Sources/Persistence, which
      # compile into the widget target too. The runner's workspace is outside
      # ~/Documents, so the iCloud xattr/codesigning trap doesn't apply here.
      - name: Build and test
        id: unit
        run: |
          rm -rf build/Tests.xcresult   # harmless on a fresh VM, needed if run locally
          xcodebuild -project BabyBuddy.xcodeproj -scheme BabyBuddy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/Tests.xcresult \
            test CODE_SIGNING_ALLOWED=NO -quiet
      # `-quiet` prints nothing on success, so a green run would otherwise never
      # say how many tests ran — including if it ran none.
      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult --format json \
            | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print("{result}: {passedTests}/{totalTestCount} passed, {failedTests} failed, {skippedTests} skipped".format(**d))
          for t in d.get("testFailures", []):
              print("  FAIL {}.{}: {}".format(t.get("targetName"), t.get("testName"), t.get("failureText")))
          sys.exit(0 if d.get("failedTests", 1) == 0 and d.get("totalTestCount", 0) > 0 else 1)
          '
      # The XCUITest suite, once the unit tests pass, on the same CI device —
      # scripts/ui-test.sh erases it first and prints its own summary. Iterations
      # are 2 so a test gets exactly one retry: one absorbs a simulator hiccup; a
      # test that needs it every run gets fixed, not retried.
      - name: UI tests
        id: ui
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: |
          UI_TEST_DEVICE=CI-BabyBuddy scripts/ui-test.sh \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -retry-tests-on-failure -test-iterations 2
      - name: Upload the UI test result bundle
        # Demo data only (the seed and the tests' own records), with a screenshot
        # of every failure — the runner is discarded when the job ends.
        if: ${{ !cancelled() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: UITests.xcresult
          path: build/UITests.xcresult
          retention-days: 7
      # The demo server lane: a real sign-in, push, pull, conflict and rejection against the Baby
      # Buddy server App Review also uses. Its own cap, so a hang in the network fails this step
      # rather than eating the job's hour. The tests skip themselves if the server is unreachable,
      # and the summary raises a warning when they do.
      #
      # Its result bundle is deliberately NOT uploaded: this repository is public, and XCUITest
      # records typed text — including the token the sign-in types.
      - name: Server UI tests
        if: ${{ !cancelled() && steps.unit.outcome == 'success' && env.HAS_DEMO_SERVER == 'true' }}
        timeout-minutes: 25
        env:
          BB_E2E_SERVER_URL: ${{ secrets.BB_E2E_SERVER_URL }}
          BB_E2E_TOKEN: ${{ secrets.BB_E2E_TOKEN }}
        run: |
          UI_TEST_DEVICE=CI-BabyBuddy scripts/ui-test.sh --server \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -retry-tests-on-failure -test-iterations 2

  attribution:
    name: attribution
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PATTERN: '(?i)^(co-authored-by|signed-off-by):.*(claude|anthropic|codex|openai|copilot|cursor|gemini|devin|aider)|generated (with|by) \[?(claude|codex|copilot|cursor|gemini|aider)|claude\.com/claude-code|🤖 generated'
    steps:
      - name: PR body and commit messages carry no attribution
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          pat = re.compile(os.environ["PATTERN"], re.M)
          repo = os.environ["GITHUB_REPOSITORY"]
          num = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["number"]
          body = subprocess.check_output(["gh", "pr", "view", str(num), "-R", repo, "--json", "body", "--jq", ".body"], text=True)
          commits = subprocess.check_output(["gh", "api", f"repos/{repo}/pulls/{num}/commits", "--paginate", "--jq", ".[].commit.message"], text=True)
          bad = [t for t in ("PR body", "commit message") if pat.search(body if t == "PR body" else commits)]
          if bad:
              print(f"::error::attribution trailer found in: {', '.join(bad)} (CLAUDE.md / global rule)")
              sys.exit(1)
          print("attribution: clean")
          PY
