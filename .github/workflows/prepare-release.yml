name: Prepare Release

# Run by hand after the release-preparation PR has merged and the version exists in App Store
# Connect. It puts the release notes into the version's "What's New" and makes a draft GitHub
# Release pinned to this commit — the commit to archive from. It never changes a version number,
# creates the App Store version, picks a build, submits, tags, or uploads anything.
#
# Safe to rerun: it overwrites the same What's New and retargets the same draft. After a
# rejection, merge the fix and the build-number bump, then run it again.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The App Store version, e.g. 1.1.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create and edit the draft release

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # See publish-release.yml: the environment's `main`-only policy is the real guard.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this from main, not $GITHUB_REF"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not a version number"; exit 1
          fi

      - uses: actions/checkout@v4

      # Everything that can be wrong is checked before anything is changed.
      - name: This commit is that version, with notes, and not yet published
        id: check
        run: |
          fail() { echo "::error::$1"; exit 1; }
          field() { sed -nE "s/^ *$1: *\"?([^\"]*)\"? *$/\1/p" project.yml | head -1; }
          [ "$(field MARKETING_VERSION)" = "$VERSION" ] || fail "MARKETING_VERSION is $(field MARKETING_VERSION), not $VERSION — merge the release-preparation PR first"
          echo "build=$(field CURRENT_PROJECT_VERSION)" >> "$GITHUB_OUTPUT"

          node scripts/release.mjs validate
          node scripts/release.mjs body "$VERSION" > "$RUNNER_TEMP/body.md"

          # `gh release view` finds drafts; the REST "release by tag" endpoint does not, and a
          # lookup that misses the draft would make a second one.
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            [ "$(jq -r .isDraft release.json)" = "true" ] || fail "$TAG is already published — a published release is never re-prepared"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the notes to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_LOCALE: ${{ vars.ASC_LOCALE }}
        run: node scripts/release.mjs send "$VERSION"

      # The target is this commit's full SHA, never `main`: GitHub creates the tag when the draft
      # is published, at whatever the target resolves to *then*.
      - name: Draft the GitHub Release
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Baby Buddy Companion $VERSION" --notes-file "$RUNNER_TEMP/body.md"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Baby Buddy Companion $VERSION" --notes-file "$RUNNER_TEMP/body.md"
          fi

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Baby Buddy Companion $VERSION, build ${{ steps.check.outputs.build }}

          Archive from \`$GITHUB_SHA\`:

              git fetch origin && git checkout $GITHUB_SHA && xcodegen generate

          - App Store Connect: What's New updated for $VERSION.
          - GitHub: draft release \`$TAG\` targets this commit. No tag exists until Publish Release.

          Next: archive, upload, select build ${{ steps.check.outputs.build }}, submit. Once the version is live, run Publish Release.
          EOF
